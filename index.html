<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        body {
            font-family: 'Arial', sans-serif;
            background: #121212;
            color: white;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            text-align: center;
        }
        
        #captcha-box {
            background: #2a2a2a;
            padding: 30px;
            border-radius: 20px;
            border: 2px solid #f1c40f;
            width: 80%;
            max-width: 300px;
        }

        h2 { margin-top: 0; color: #f1c40f; }
        
        button {
            background: #f1c40f;
            color: #121212;
            border: none;
            padding: 15px 30px;
            border-radius: 10px;
            font-size: 18px;
            font-weight: bold;
            cursor: pointer;
            margin-top: 20px;
            width: 100%;
        }

        #success-screen {
            display: none;
            flex-direction: column;
            align-items: center;
            animation: fadeIn 0.3s ease;
        }

        .big-checkmark {
            font-size: 100px;
            color: #4bb71b;
            margin-bottom: 20px;
            animation: pop 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        .success-text {
            font-size: 24px;
            font-weight: bold;
            color: #4bb71b;
        }

        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
        @keyframes pop { 0% { transform: scale(0); } 100% { transform: scale(1); } }

        .hidden { display: none !important; }
    </style>
</head>
<body>
    <div id="captcha-box">
        <h2>🤖 Проверка</h2>
        <p>Нажми кнопку, чтобы подтвердить, что ты не робот.</p>
        <button id="verifyBtn">✅ Я не робот</button>
    </div>

    <div id="success-screen">
        <div class="big-checkmark">✅</div>
        <div class="success-text">Вы участвуете!</div>
        <button id="closeBtn" style="background: #444; color: white; margin-top: 30px;">Вернуться в канал</button>
    </div>

    <script>
        let tg = window.Telegram.WebApp;
        tg.expand();

        document.getElementById('verifyBtn').onclick = () => {
            document.getElementById('captcha-box').classList.add('hidden');
            document.getElementById('success-screen').style.display = 'flex';
            
            if (tg.HapticFeedback) {
                tg.HapticFeedback.notificationOccurred('success');
            }
        };

        document.getElementById('closeBtn').onclick = () => {
            tg.sendData(JSON.stringify({ action: "captcha_passed" }));
            tg.close();
        };
    </script>
</body>
</html>
